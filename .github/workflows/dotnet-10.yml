name: CP166 .NET 10 build and tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore WarcraftSim.slnx
      - name: Build
        run: dotnet build WarcraftSim.slnx --no-restore --configuration Release -warnaserror
      - name: Test
        run: dotnet test WarcraftSim.slnx --no-build --configuration Release --logger 'console;verbosity=normal'
