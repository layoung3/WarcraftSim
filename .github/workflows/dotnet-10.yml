name: CP166 .NET 10 build and tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      client_build:
        description: 'Pinned Forever 1.60.1.x build for optional live source acquisition'
        required: false
        default: '1.60.1.70707'
      imported_at:
        description: 'Explicit UTC timestamp for deterministic acquisition metadata'
        required: false
        default: '2026-10-30T15:00:00Z'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: CP174 frontend JavaScript syntax
        run: node --check WarcraftSim.Api/wwwroot/solo-dps.js
      - name: CP174 frontend DOM contract checks
        run: node tools/solo-dps-ui-contract.test.cjs
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore WarcraftSim.slnx
      - name: Build
        run: dotnet build WarcraftSim.slnx --no-restore --configuration Release -warnaserror
      - name: Test
        run: dotnet test WarcraftSim.slnx --no-build --configuration Release --logger 'console;verbosity=normal'
      - name: CP172 numerical dynamic equipment simulation comparisons
        run: dotnet test WarcraftSim.Tests/WarcraftSim.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~Cp172DynamicStatsAndLiveEffects --logger 'console;verbosity=detailed'
      - name: CP173 real combat modifier and racial comparison tests
        run: dotnet test WarcraftSim.Tests/WarcraftSim.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~Cp173 --logger 'console;verbosity=detailed'
      - name: CP171 reviewed catalog and CLI smoke
        run: |
          dotnet run --project tools/ForeverEquipmentImportCli --configuration Release --no-build -- import WarcraftSim.Api/Catalog/forever-equipment-v1.json WarcraftSim.Api/Catalog/forever-equipment-cp171-reviewed.json /tmp/forever-reviewed-a.json /tmp/forever-reviewed-report.json
          dotnet run --project tools/ForeverEquipmentImportCli --configuration Release --no-build -- import WarcraftSim.Api/Catalog/forever-equipment-v1.json WarcraftSim.Api/Catalog/forever-equipment-cp171-reviewed.json /tmp/forever-reviewed-b.json /tmp/forever-reviewed-report-b.json
          cmp /tmp/forever-reviewed-a.json /tmp/forever-reviewed-b.json
          grep -q 'reviewedOverrides' /tmp/forever-reviewed-report.json
      - name: CP171 offline CSV metadata staging smoke
        run: |
          mkdir -p /tmp/forever-csv/1.60.1.70532
          cat > /tmp/forever-csv/1.60.1.70532/ItemSparse.csv <<'CSV'
          ID,Display_lang,RequiredLevel
          19102,Crackling Staff,60
          20368,Bland Bow of Steadiness,60
          CSV
          python3 tools/ForeverEquipmentImportCli/download_client_csv.py stage --directory /tmp/forever-csv --build 1.60.1.70532 --imported-at 2026-10-30T15:00:00Z --output /tmp/forever-candidates.json
          python3 -c 'import json; x=json.load(open("/tmp/forever-candidates.json")); assert len(x["metadataOnly"]) == 2 and x["items"] == []'
          dotnet run --project tools/ForeverEquipmentImportCli --configuration Release --no-build -- import WarcraftSim.Api/Catalog/forever-equipment-v1.json /tmp/forever-candidates.json /tmp/forever-metadata-only.json /tmp/forever-metadata-report.json
          python3 -c 'import json; x=json.load(open("/tmp/forever-metadata-report.json")); assert x["report"]["metadataOnly"] == 2 and x["report"]["newVerified"] == 0 and x["report"]["totalCatalog"] == 24'
          grep -q 'metadataOnly' /tmp/forever-metadata-report.json

      - name: CP171 bulk DB2 normalization, schema and hotfix regression
        run: |
          python3 -m unittest discover -s tools/ForeverEquipmentImportCli -p 'test_*.py' -v
      - name: CP171 bulk-normalizer to CP170 .NET importer contract
        run: python3 tools/ForeverEquipmentImportCli/integration_smoke.py --build
      - name: CP173 real build character/modifier source census (advisory)
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python3 tools/ForeverEquipmentImportCli/download_client_csv.py fetch --build 1.60.1.70707 --directory /tmp/cp173-real-source --tables SpellEffect Spell PlayerExpectedStat ChrRaces ChrClasses || true
          python3 tools/ForeverEquipmentImportCli/normalize_modifiers.py --build 1.60.1.70707 --directory /tmp/cp173-real-source --output /tmp/cp173-real-source/modifier-candidates.json
          python3 tools/ForeverEquipmentImportCli/normalize_modifiers.py --build 1.60.1.70707 --directory /tmp/cp173-real-source --output /tmp/cp173-real-source/modifier-candidates-b.json
          cmp /tmp/cp173-real-source/modifier-candidates.json /tmp/cp173-real-source/modifier-candidates-b.json
      - name: CP173 preserve pinned modifier and base-table acquisition evidence
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cp173-real-70707-character-modifier-census
          path: |
            /tmp/cp173-real-source/modifier-candidates.json
            /tmp/cp173-real-source/1.60.1.70707/acquisition-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: CP172 pinned real Forever enchant census (nonblocking research)
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 6
        run: |
          mkdir -p /tmp/cp172-real-census
          python3 tools/ForeverEquipmentImportCli/download_client_csv.py fetch --build 1.60.1.70707 --directory /tmp/cp172-real-census --tables SpellItemEnchantment SpellEffect Spell
          python3 tools/ForeverEquipmentImportCli/normalize_enchants.py --directory /tmp/cp172-real-census --build 1.60.1.70707 --output /tmp/cp172-real-census/enchant-candidates.json
          python3 -c 'import json; p="/tmp/cp172-real-census/enchant-candidates.json"; r=json.load(open(p)); keys=("discovered","staticCandidates","staticPartialCandidates","staticLinkedCandidates","withUnmodeledEffects","unlinked","notSelectable"); print("CP172 REAL PINNED CENSUS", json.dumps({k:r[k] for k in keys},sort_keys=True)); open("/tmp/cp172-real-census/census-summary.json","w").write(json.dumps({k:r[k] for k in ("build","checksums",*keys)},indent=2,sort_keys=True))'
      - name: CP172 preserve real census receipts (nonblocking research)
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cp172-real-70707-enchant-census
          path: |
            /tmp/cp172-real-census/census-summary.json
            /tmp/cp172-real-census/enchant-candidates.json
            /tmp/cp172-real-census/1.60.1.70707/acquisition-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: CP171 one-time real 70707 caster, Hunter and set-item formula calibration
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python3 tools/ForeverEquipmentImportCli/download_client_csv.py fetch --build 1.60.1.70707 --directory /tmp/cp171-final-source
          python3 tools/ForeverEquipmentImportCli/bulk_normalize.py --build 1.60.1.70707 --directory /tmp/cp171-final-source --source-url 'https://wago.tools/db2/ItemSparse/csv?build=1.60.1.70707&locale=enUS' --imported-at 2026-10-30T17:40:00Z --catalog-version '70707-final-calibration-not-approved' --formula-preview /tmp/cp171-final-preview.json --output /tmp/cp171-final-metadata.json --report /tmp/cp171-final-report.json
          python3 tools/ForeverEquipmentImportCli/verify_formula_observations.py --preview /tmp/cp171-final-preview.json --observations tools/ForeverEquipmentImportCli/observations/forever-70707-current-categories.json --resolved-output /tmp/cp171-final-proposals.json --report /tmp/cp171-final-proposal-report.json
          python3 -c 'import json; r=json.load(open("/tmp/cp171-final-proposal-report.json")); print("CALIBRATION",json.dumps({ "matched":r["matched"], "quarantined":r["quarantined"],"items":r["items"]},sort_keys=True))'
      - name: CP171 live pinned DB2 CSV acquisition and bulk metadata normalization (advisory)
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_BUILD: ${{ inputs.client_build }}
          IMPORTED_AT: ${{ inputs.imported_at }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python3 tools/ForeverEquipmentImportCli/download_client_csv.py fetch --build "$SOURCE_BUILD" --directory /tmp/forever-live-cp171 || true
          python3 tools/ForeverEquipmentImportCli/bulk_normalize.py --build "$SOURCE_BUILD" --directory /tmp/forever-live-cp171 --source-url "https://wago.tools/db2/ItemSparse/csv?build=${SOURCE_BUILD}&locale=enUS" --imported-at "$IMPORTED_AT" --catalog-version "forever-${SOURCE_BUILD}-metadata-audit" --output /tmp/forever-live-manifest.json --report /tmp/forever-live-report.json
          python3 -c 'import json; r=json.load(open("/tmp/forever-live-report.json")); print(json.dumps({k:r[k] for k in ("requestedBuild","discoveredIds","joinedIds","approvedCombatRecords","metadataOnly","missingOptionalTables","missingScalingTables","tableSha256")},indent=2))'
      - name: CP172 pinned SpellItemEnchantment and SpellEffect normalization (advisory)
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_BUILD: ${{ inputs.client_build }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 tools/ForeverEquipmentImportCli/normalize_enchants.py --directory /tmp/forever-live-cp171 --build "$SOURCE_BUILD" --output /tmp/forever-cp172-enchants-source.json
          python3 -c 'import json; r=json.load(open("/tmp/forever-cp172-enchants-source.json")); print(json.dumps({k:r[k] for k in ("build","discovered","staticCandidates","withUnmodeledEffects","unlinked")},indent=2))'
      - name: CP172 retain pinned enchant normalization candidates (manual only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cp172-enchants-pinned-candidates
          path: /tmp/forever-cp172-enchants-source.json
          if-no-files-found: warn
          retention-days: 7
      - name: CP171 single-table pinned public source probe (advisory only)
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_BUILD: ${{ inputs.client_build }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          for table in ItemSparse Item ItemEffect ItemXItemEffect ItemSet ItemSetSpell ItemDamageOneHand ItemArmorTotal; do
            python3 tools/ForeverEquipmentImportCli/probe_live_source.py --build "$SOURCE_BUILD" --table "$table" || true
          done
