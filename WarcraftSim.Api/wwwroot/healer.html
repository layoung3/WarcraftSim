<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WarcraftSim · Healer Preview (CP125)</title>
<style>
:root {font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;background:#101827;color:#e6edf8}
body {max-width:1150px;margin:30px auto;padding:0 18px}a {color:#a8caff}h1 {margin-bottom:4px}p {color:#a9b5cb}
.panel {border:1px solid #37465a;border-radius:12px;padding:20px;margin:16px 0;background:#1a2638}
.grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
label {display:grid;gap:7px;font-size:13px;color:#c4cfdf}input {background:#0d1627;color:white;border:1px solid #576479;padding:9px;border-radius:7px;font:inherit}
button {border:0;background:#467bc9;color:white;padding:12px 20px;border-radius:8px;font-weight:600;cursor:pointer}
button:disabled {opacity:.5;cursor:wait}.metric {font-size:26px;font-weight:700;margin-top:6px}.small {font-size:13px}
pre {white-space:pre-wrap;max-height:450px;overflow:auto;background:#0d1627;border-radius:8px;padding:15px}
</style></head><body>
<a href="/warrior.html">← Warrior simulator</a><h1>Holy Priest healing preview</h1>
<p>CP125 isolated fixture · Real tank HP · Shared boss melee + healer decisions. Spell numbers, regen and unmitigated boss swings are provisional inputs—not level-60 Forever calibration.</p>
<div class="panel"><div class="grid">
<label>Duration (seconds)<input id="durationSeconds" type="number" min="1" max="1800" value="120"></label>
<label>Tank max HP<input id="tankMaximumHealth" type="number" min="1" value="3000"></label>
<label>Boss swing damage<input id="bossSwingDamage" type="number" min="0" value="360"></label>
<label>Boss swing interval (s)<input id="bossSwingIntervalSeconds" type="number" min="0.1" step="0.1" value="2"></label>
<label>Priest max mana<input id="priestMaximumMana" type="number" min="1" value="5000"></label>
<label>Mana regen / second<input id="priestManaRegenPerSecond" type="number" min="0" value="12"></label>
<label>Flash Heal amount<input id="flashHealAmount" type="number" min="1" value="680"></label>
<label>Flash Heal mana<input id="flashHealManaCost" type="number" min="0" value="180"></label>
<label>Greater Heal amount<input id="greaterHealAmount" type="number" min="1" value="1550"></label>
<label>Greater Heal mana<input id="greaterHealManaCost" type="number" min="0" value="410"></label>
</div><p><label style="display:flex;align-items:center;gap:10px"><input id="enableHealer" type="checkbox" checked> Enable Priest healing</label></p>
<button id="run">Run encounter</button> <span class="small" id="status"></span></div>
<div class="panel" id="results" hidden><div class="grid" id="summary"></div>
<details><summary>Selected combat events</summary><pre id="timeline"></pre></details>
<button id="export">Export results JSON</button></div>
<script>
'use strict';let last=null;
const keys=['durationSeconds','tankMaximumHealth','bossSwingDamage','bossSwingIntervalSeconds','priestMaximumMana','priestManaRegenPerSecond','flashHealAmount','flashHealManaCost','greaterHealAmount','greaterHealManaCost'];
const el=id=>document.getElementById(id);
el('run').addEventListener('click',async()=>{
 const b=el('run');b.disabled=true;el('status').textContent='Running...';
 try{
  const request=Object.fromEntries(keys.map(k=>[k,Number(el(k).value)]));request.enableHealer=el('enableHealer').checked;
  request.captureTimeline=true;
  const response=await fetch('/api/sim/healer-preview/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request)});
  const data=await response.json();if(!response.ok)throw Error(data.error??JSON.stringify(data));last={request,response:data};
  const fields=[['Tank survived',data.tankSurvived?'Yes':'No'],['Tank remaining HP',Number(data.tankEndingHealth).toFixed(0)],['Healer remaining mana',Number(data.priestEndingMana).toFixed(0)],['Effective healing',Number(data.healingDone).toFixed(1)],['Overhealing',Number(data.overhealingDone).toFixed(1)],['Flash Heal casts',data.flashHealCasts],['Greater Heal casts',data.greaterHealCasts],['Tank damage taken',Number(data.tankDamageTaken).toFixed(1)]];
  el('summary').replaceChildren(...fields.map(([name,value])=>{let d=document.createElement('div'),s=document.createElement('div'),m=document.createElement('div');s.className='small';s.textContent=name;m.className='metric';m.textContent=value;d.append(s,m);return d}));
  el('timeline').textContent=(data.run?.timeline??[]).filter(e=>[3,4,6,7,8,13].includes(e.type)).map(e=>`${Number(e.timeSeconds).toFixed(2)}s  ${e.description??e.abilityKey??'Event'}`).slice(0,180).join('\n');
  el('results').hidden=false;el('status').textContent='Complete';
 }catch(err){el('status').textContent=err.message}finally{b.disabled=false}
});
el('export').addEventListener('click',()=>{if(!last)return;const blob=new Blob([JSON.stringify(last,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='cp125-healer-results.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
</script></body></html>
